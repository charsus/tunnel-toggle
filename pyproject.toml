[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-toggle"
version = "0.1.0a1"
description = "A KDE Plasma system tray application for controlling a NetworkManager tunnel."
keywords = [
    "kde",
    "networkmanager",
    "plasma",
    "vpn",
    "wireguard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tunnel Toggle contributors" },
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/charsus/tunnel-toggle"
Source = "https://github.com/charsus/tunnel-toggle"
Issues = "https://github.com/charsus/tunnel-toggle/issues"
Changelog = "https://github.com/charsus/tunnel-toggle/blob/main/CHANGELOG.md"

[project.scripts]
tunnel-toggle = "tunnel_toggle.main:main"

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-qt",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["tunnel_toggle*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tunnel_toggle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = ["--import-mode=importlib"]
